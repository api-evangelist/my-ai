aid: my-ai
name: My AI
description: My AI Inc. is the company behind Me Protocol, a universal open rewards
  infrastructure that lets brands issue, redeem, and swap loyalty rewards across a
  decentralized cross-brand ecosystem through a single API integration. Founded in
  2022 by Robert Wesley and Paul Oamen and backed by 500 Global, the protocol combines
  an EVM smart-contract layer (Sepolia, Hedera, Base, Polygon), a hosted Platform-as-a-Service
  REST API, and embeddable SDKs — an AI agent chatbot widget plus drop-in React and
  inline payment components — so merchants can plug frictionless open rewards into
  web and agent-driven storefronts for the emerging AI Agent Economy.
